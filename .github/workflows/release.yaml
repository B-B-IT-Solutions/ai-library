name: Release Pipeline

on:
   release:
      types: [published]

env:
   REGISTRY: ghcr.io
   IMAGE_NAME: ${{ github.repository }}

jobs:
   ci:
      uses: ./.github/workflows/ci.yaml
      permissions:
         contents: read
         checks: write
         pull-requests: write
   build-and-push-image:
      runs-on: ubuntu-24.04
      # needs: ci
      permissions:
         contents: write
         packages: write
         attestations: write
         id-token: write
         checks: write
      steps:
         - name: Setup Node v22
           uses: actions/setup-node@v4
           with:
              node-version: 22

         - name: Checkout repository
           uses: actions/checkout@v4

         - name: Log in to the Container registry
           uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
           with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

         - name: Extract metadata (tags, labels) for Docker
           id: meta
           uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
           with:
              images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

         - name: Build and push Docker image
           id: push
           uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
           with:
              context: .
              push: ${{ github.event_name == 'release' }}
              tags: ${{ steps.meta.outputs.tags }}
              labels: ${{ steps.meta.outputs.labels }}

         - name: Extract metadata (tags, labels) for migratedb Docker image
           id: meta-migratedb
           uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
           with:
              images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-migratedb

         - name: Build and push migratedb Docker image
           id: push-migratedb
           uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
           with:
              context: .
              target: migratedb
              push: ${{ github.event_name == 'release' }}
              tags: ${{ steps.meta-migratedb.outputs.tags }}
              labels: ${{ steps.meta-migratedb.outputs.labels }}

         # - name: Generate artifact attestation
         #   uses: actions/attest-build-provenance@v1
         #   with:
         #      subject-name: ${{ steps.meta.outputs.tags }}
         #      subject-digest: ${{ steps.push.outputs.digest }}
         #      push-to-registry: true
