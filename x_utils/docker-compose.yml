services:
   postgres:
      image: postgres:16.2
      ports:
         - 5432:5432
      environment:
         - POSTGRES_PASSWORD=test
         - POSTGRES_USER=user1
         - POSTGRES_DB=ailibrary
      healthcheck:
         test: ["CMD-SHELL", "pg_isready -U user1 -d ailibrary"]
         interval: 5s
         timeout: 5s
         retries: 10
      volumes:
         - postgres_data:/var/lib/postgresql/data
volumes:
   postgres_data:
      driver: local
