services:
   app:
      build: ../.
      ports:
         - "3000:3000"
      environment:
         NODE_ENV: production
         DATABASE_URL: postgresql://user1:test@localhost:5432/ailibrary

         # Auth
         AUTH_SECRET: ${AUTH_SECRET}
         AUTH_URL: ${AUTH_URL:-http://localhost:3000}
         NEXTAUTH_URL_INTERNAL: ${NEXTAUTH_URL_INTERNAL:-http://app:3000}
         ENCRYPTION_KEY: ${ENCRYPTION_KEY}

         # App
         NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-KI Bibliothek}
         NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
         NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}

         # Stripe
         NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
         STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
         STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      depends_on:
         postgres:
            condition: service_healthy
      restart: unless-stopped

   postgres:
      image: postgres:16.2
      ports:
         - 5432:5432
      environment:
         - POSTGRES_PASSWORD=test
         - POSTGRES_USER=user1
         - POSTGRES_DB=ailibrary
      healthcheck:
         test: ["CMD-SHELL", "pg_isready -U user1 -d ailibrary"]
         interval: 5s
         timeout: 5s
         retries: 10
      volumes:
         - postgres_data:/var/lib/postgresql/data
volumes:
   postgres_data:
      driver: local
